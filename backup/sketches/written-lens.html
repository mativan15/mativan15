<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Written lens · Amber Lens</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #07080A; }
    body {
      color: #E7E1D6;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }
    .stage {
      position: relative;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      background: #07080A;
    }
    .hole {
      position: absolute;
      z-index: 1;
      left: 0;
      top: 0;
      width: 156px;
      height: 156px;
      border-radius: 50%;
      overflow: hidden;
      border: 1.5px solid rgba(231, 225, 214, 0.85);
      box-shadow: 0 0 0 1px rgba(232, 160, 74, 0.35);
      pointer-events: none;
      opacity: 0;
    }
    .hole img {
      position: absolute;
      left: 0;
      top: 0;
      max-width: none;
      object-fit: cover;
      object-position: 72% center;
    }
    .field { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
    .glyph {
      position: absolute;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 14px;
      color: #E7E1D6;
      white-space: nowrap;
      will-change: transform;
    }
    .glyph.is-amber { color: #E8A04A; }
    .nav {
      position: absolute;
      z-index: 5;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 22px;
      padding: 12px 22px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(232, 160, 74, 0.45);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28);
      backdrop-filter: blur(18px) saturate(1.6);
    }
    .nav a {
      color: #E7E1D6;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .nav a[aria-current="page"] { color: #E8A04A; }
    .nav a:focus-visible { outline: 2px solid #E8A04A; outline-offset: 4px; }
    h1 {
      position: absolute;
      z-index: 4;
      left: 7vw;
      top: 50%;
      transform: translateY(-50%);
      margin: 0;
      font-size: clamp(64px, 8vw, 120px);
      line-height: 0.85;
      letter-spacing: -0.045em;
      pointer-events: none;
    }
    .hint {
      position: absolute;
      z-index: 4;
      right: 28px;
      bottom: 24px;
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      opacity: 0.72;
    }
    @media (max-width: 800px) {
      h1 { top: 96px; transform: none; font-size: 56px; }
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="hole" id="hole" aria-hidden="true">
      <img id="hole-img" src="amber-lens.jpg" alt="">
    </div>
    <div class="field" id="field" aria-hidden="true"></div>
    <nav class="nav" aria-label="Sketches">
      <a href="canopy.html">Canopy</a>
      <a href="written-lens.html" aria-current="page">Written lens</a>
      <a href="tree.html">Tree</a>
    </nav>
    <h1>Ivan<br>Sardon</h1>
    <p class="hint">Move the pointer</p>
  </div>
  <script>
    const GLYPHS = ["{", "}", "(", ")", ";", "->", "=>", "0x", "[", "]", "fn", "#", "&", "*", "/", "="];
    const HOLE = 156;
    const stage = document.getElementById("stage");
    const field = document.getElementById("field");
    const hole = document.getElementById("hole");
    const holeImg = document.getElementById("hole-img");
    const mouse = { x: -9999, y: -9999, on: false };
    let items = [];

    function homes(w, h) {
      const cx = w * 0.70;
      const cy = h * 0.52;
      const radius = Math.min(w, h) * 0.30;
      const list = [];
      const count = 68;
      for (let i = 0; i < count; i++) {
        const angle = (i / count) * Math.PI * 2 - Math.PI / 2;
        list.push({
          x: cx + Math.cos(angle) * radius,
          y: cy + Math.sin(angle) * radius * 0.92,
          glyph: GLYPHS[i % GLYPHS.length],
          amber: i % 4 === 0
        });
      }
      return list;
    }

    function build() {
      const w = stage.clientWidth;
      const h = stage.clientHeight;
      holeImg.style.width = w + "px";
      holeImg.style.height = h + "px";
      field.replaceChildren();
      items = homes(w, h).map((home) => {
        const el = document.createElement("span");
        el.className = "glyph" + (home.amber ? " is-amber" : "");
        el.textContent = home.glyph;
        el.style.left = home.x + "px";
        el.style.top = home.y + "px";
        field.appendChild(el);
        return { ...home, el, base: home.amber ? 0.95 : 0.78 };
      });
    }

    function place() {
      const reach = 120;
      if (!mouse.on) {
        hole.style.opacity = "0";
      } else {
        const hx = mouse.x - HOLE / 2;
        const hy = mouse.y - HOLE / 2;
        hole.style.opacity = "1";
        hole.style.transform = "translate(" + hx + "px, " + hy + "px)";
        holeImg.style.transform = "translate(" + (-hx) + "px, " + (-hy) + "px)";
      }

      for (const item of items) {
        if (!mouse.on) {
          item.el.style.transform = "translate(-50%, -50%)";
          item.el.style.opacity = String(item.base);
          continue;
        }
        const dx = item.x - mouse.x;
        const dy = item.y - mouse.y;
        const dist = Math.hypot(dx, dy) || 0.001;
        const insideHole = dist < HOLE / 2;
        if (dist < reach) {
          const force = (reach - dist) / reach;
          const tx = (dx / dist) * force * 70;
          const ty = (dy / dist) * force * 70;
          item.el.style.transform = "translate(calc(-50% + " + tx + "px), calc(-50% + " + ty + "px))";
          item.el.style.opacity = insideHole ? "0" : String(item.base * (dist / reach));
        } else {
          item.el.style.transform = "translate(-50%, -50%)";
          item.el.style.opacity = String(item.base);
        }
      }
      requestAnimationFrame(place);
    }

    stage.addEventListener("pointermove", (event) => {
      const rect = stage.getBoundingClientRect();
      mouse.x = event.clientX - rect.left;
      mouse.y = event.clientY - rect.top;
      mouse.on = true;
    });
    stage.addEventListener("pointerleave", () => {
      mouse.on = false;
    });
    window.addEventListener("resize", build);
    build();
    requestAnimationFrame(place);
  </script>
</body>
</html>
