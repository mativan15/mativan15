<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <meta http-equiv="refresh" content="0; url=index.html#about">
    <link rel="canonical" href="https://mativan15.github.io/mativan15/">
    <title data-i18n="redirect.title">Redirecting to Ivan Sardon's Portfolio</title>
    <script>
        (function () {
            var saved = "";
            try { saved = localStorage.getItem("site-lang") || ""; } catch (e) {}
            var fromUrl = new URLSearchParams(location.search).get("lang") || "";
            var lang = (saved === "en" || saved === "pt" || saved === "es") ? saved : (fromUrl === "en" || fromUrl === "pt" || fromUrl === "es") ? fromUrl : "";
            window.location.replace("index.html" + (lang ? "?lang=" + lang : "") + "#about");
        })();
    </script>
</head>
<body>
    <p data-i18n-html="redirect.about">This page has moved to <a href="index.html#about">the About section of the portfolio</a>.</p>
</body>
</html>
